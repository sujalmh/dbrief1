name: F1 Data CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # efficient caching if needed, but we'll stick to simple setup
      
    steps:
    - uses: actions/checkout@v3

    # ------------------------------------------------------------------
    # Backend Setup & Tests
    # ------------------------------------------------------------------
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      working-directory: ./api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest requests httpx

    - name: Start API Server
      working-directory: ./api
      run: |
        # Start uvicorn in background
        nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        # Wait for server to be ready
        sleep 10
        curl http://localhost:8000/docs > /dev/null

    - name: Run All Backend E2E Tests
      working-directory: ./api
      run: |
        # Run all E2E tests
        python -m pytest test_historical_data_e2e.py -v

    # ------------------------------------------------------------------
    # Frontend/Planner Setup & Tests
    # ------------------------------------------------------------------
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './main/package.json'

    - name: Install Node dependencies
      working-directory: ./main
      run: npm ci

    - name: Run All Vite Tests (Including Real LLM)
      working-directory: ./main
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        # Run all tests covering unit and integration
        npm run test 
